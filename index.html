<html lang="id">

<head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center">

  <section class="bg-white p-10 rounded-lg shadow-2xl text-center">
    <!-- gambar gruop dc -->
  
      <!-- image bulat -->

    <!-- tombol link -->
    
    <!-- tombol premium -->
    <a id="linkButton"
      href="https://www.roblox.com/share?code=_1g3jty26mfbqqna115ch2sva9568in54oldarv7rv7z3fhhr2r&type=ExperienceInvite"
      target="_blank" rel="noopener noreferrer"
      class="bg-[#606cf8] w-[500px] h-[50px] items-center justify-center flex text-white font-semibold rounded-md  active:bg-blue-800 transition-colors btn-focus"
      aria-label="Buka tautan eksternal">

        <img src="logo_dc.png" alt="logo-discrod" class="w-20 h-12 mr-2 bg-[#606cf8]"> 
     
      gruop discrod | Masuk Sekarang!

    <!-- jarak antar tombol link -->
     <br>
    <!-- tombol server roblox -->
    <a id="linkButton"
      href="https://www.roblox.com/share?code=_1g3jty26mfbqqna115ch2sva9568in54oldarv7rv7z3fhhr2r&type=ExperienceInvite"

  <footer>
    <div class="text-center mt-6 text-gray-500">
      &copy; 2025 berkat_bt! | All rights reserved.
    </div>
  </footer>
  <!-- Ubah nilai href di <a> ini ke URL yang ingin diakses -->

  <!-- Opsional: script kecil untuk mengganti link lewat query string ?u=URL -->
  <script>
    (function () {
      try {
        const params = new URLSearchParams(location.search);
        const u = params.get('u');
        if (u) {
          const a = document.getElementById('linkButton');
          // Validasi sederhana: tambahkan protokol jika tidak ada
          const normalized = /^(https?:\/\/)/i.test(u) ? u : 'https://' + u;
          a.href = normalized;
        }
      } catch (e) {
        // jika terjadi error, abaikan saja
        console.warn('Tidak bisa membaca query param u', e);
      }
    })();
  </script>
</body>

</html>
