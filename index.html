<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Akses</title>
  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center">

  <section class="bg-white p-6 sm:p-10 rounded-lg shadow-2xl text-center max-w-xl mx-auto">
  <!-- gambar grup dc -->
  <img src="Fish-It-Roblox-2.jpeg" alt="gambar grup dc" class="w-24 h-24 sm:w-32 sm:h-32 rounded-full mx-auto mb-4 object-cover">

  <!-- tombol link Discord -->
  <a id="linkButton"
    href="https://discord.gg/GWHXCVYc"
    target="_blank" rel="noopener noreferrer"
    class="bg-[#606cf8] w-full sm:w-[500px] h-12 sm:h-[50px] flex items-center justify-center text-white font-semibold rounded-md active:bg-blue-800 transition-colors mx-auto mb-4 px-4">
    <img src="logo_dc.png" alt="logo-discord" class="w-10 h-8 sm:w-20 sm:h-12 mr-2 bg-[#606cf8] object-contain">
    Group Discord | Masuk Sekarang!
  </a>

  <!-- tombol server Roblox -->
  <a id="linkButton"
    href="https://www.roblox.com/share?code=_1g3jty26mfbqqna115ch2sva9568in54oldarv7rv7z3fhhr2r&type=ExperienceInvite"
    target="_blank" rel="noopener noreferrer"
    class="bg-[#606cf8] w-full sm:w-[500px] h-12 sm:h-[50px] flex items-center justify-center text-white font-semibold rounded-md hover:scale-105 duration-300 transition-transform active:bg-blue-800 mx-auto px-4">
    <img src="logo-RB.png" alt="logo-roblox" class="w-10 h-8 sm:w-20 sm:h-12 mr-2 bg-[#606cf8] object-contain">
    Server Roblox | Masuk Sekarang!
  </a>

  <!-- footer -->
  <div class="text-center mt-6 text-gray-500 text-sm sm:text-base">
    &copy; 2025 <span class="font-semibold">berkat_bt!</span> | All rights reserved.
  </div>
</section>




  <!-- Ubah nilai href di <a> ini ke URL yang ingin diakses -->

  <!-- Opsional: script kecil untuk mengganti link lewat query string ?u=URL -->
  <script>
    (function () {
      try {
        const params = new URLSearchParams(location.search);
        const u = params.get('u');
        if (u) {
          const a = document.getElementById('linkButton');
          // Validasi sederhana: tambahkan protokol jika tidak ada
          const normalized = /^(https?:\/\/)/i.test(u) ? u : 'https://' + u;
          a.href = normalized;
        }
      } catch (e) {
        // jika terjadi error, abaikan saja
        console.warn('Tidak bisa membaca query param u', e);
      }
    })();
  </script>
</body>

</html>
